apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 构建时间戳（App 内「关于」显示，用户用来确认装的包对不对）
static def buildTime() {
    return new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date())
}

android {
    namespace 'com.volcano.drawtouch'
    compileSdk 34

    defaultConfig {
        applicationId "com.volcano.drawtouch"
        minSdk 21
        targetSdk 34
        versionCode 25
        versionName "1.4.9"
        // 构建信息注入 BuildConfig：BUILD_TIME 每次构建都是当前时间
        buildConfigField "String", "BUILD_TIME", "\"${buildTime()}\""
        // 真机端到端测试（androidTest）：驱动真实 PenCanvasView 跑真实手势
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    // 真机端到端测试：驱动真实 PenCanvasView 跑真实双指手势
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
