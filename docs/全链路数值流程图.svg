<svg viewBox='0 0 680 690' width='100%' role='img' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,-apple-system,sans-serif'>
<title>SpenTablet 全链路数值流程图：手机手势判定 → 语义指令过网 → PC 合成触点注入</title>
<desc>图2流程展开：左侧八个环节，右侧挂实际数值，橙色框为关键出入数据（13字节语义帧与Up定稿帧）。</desc>
<defs><marker id='arrowD' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M2 1L8 5L2 9' fill='none' stroke='#5F5E5A' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs>
<rect x='40' y='40' width='600' height='30' rx='8' fill='#9FE1CB'/>
<text x='340' y='60' text-anchor='middle' font-size='14' font-weight='500' fill='#04342C'>手机端 —— 手势翻译官 · 原始双指坐标只在这里存在</text>
<rect x='40' y='86' width='190' height='48' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='0.5'/>
<text x='135' y='115' text-anchor='middle' font-size='14' font-weight='500' fill='#04342C'>① 触摸事件流</text>
<text x='270' y='106' font-size='12' fill='#2C2C2A'>pointer0 (620.3, 815.2) px · 食指</text>
<text x='270' y='124' font-size='12' fill='#5F5E5A'>pointer1 (705.8, 830.1) px · 拇指 · 每 16ms 一帧</text>
<path d='M135 134V146' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='146' width='190' height='48' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='0.5'/>
<text x='135' y='175' text-anchor='middle' font-size='14' font-weight='500' fill='#04342C'>② 双指状态机</text>
<text x='270' y='166' font-size='12' fill='#2C2C2A'>tpVecA (12.4, -3.1)   tpVecB (-14.8, 2.9)</text>
<text x='270' y='184' font-size='12' fill='#5F5E5A'>点积 = -192.5 &lt; 0 → 判成捏合 · 锁存</text>
<path d='M135 194V206' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='206' width='190' height='48' rx='8' fill='#E1F5EE' stroke='#0F6E56' stroke-width='0.5'/>
<text x='135' y='235' text-anchor='middle' font-size='14' font-weight='500' fill='#04342C'>③ 系数 + 死区</text>
<text x='270' y='226' font-size='12' fill='#2C2C2A'>span 185.6 → 191.2 → factor = 1.0302</text>
<text x='270' y='244' font-size='12' fill='#5F5E5A'>|1.0302−1| = 0.0302 &gt; 0.005 ✓ 发帧（≤ 0.005 丢弃）</text>
<path d='M135 254V266' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='266' width='190' height='56' rx='8' fill='#FAEEDA' stroke='#BA7517' stroke-width='1.5'/>
<text x='135' y='288' text-anchor='middle' font-size='14' font-weight='500' fill='#633806'>④ 语义指令帧</text>
<text x='135' y='308' text-anchor='middle' font-size='11' fill='#854F0B'>53 50 07 0D 06 | D8 DD 83 3F</text>
<text x='270' y='286' font-size='12' fill='#2C2C2A'>kind = MOUSE_ZOOM · factor = 1.0302</text>
<text x='270' y='304' font-size='12' fill='#A32D2D'>没有任何坐标 —— 全部信息就这 4 字节</text>
<path d='M135 322V364' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<line x1='40' y1='338' x2='640' y2='338' stroke='#888780' stroke-width='0.5' stroke-dasharray='4 4'/>
<text x='340' y='356' text-anchor='middle' font-size='12' fill='#5F5E5A'>—— 网络：只有语义指令过网，触点数据从未离开手机 ——</text>
<rect x='40' y='364' width='600' height='30' rx='8' fill='#B5D4F4'/>
<text x='340' y='384' text-anchor='middle' font-size='14' font-weight='500' fill='#0C447C'>PC 端 —— 手势演员 · POINTER_TOUCH_INFO 在这里才诞生</text>
<rect x='40' y='410' width='190' height='48' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='135' y='439' text-anchor='middle' font-size='14' font-weight='500' fill='#0C447C'>⑤ 解析 + 取中心</text>
<text x='270' y='430' font-size='12' fill='#2C2C2A'>解析：factor = 1.0302</text>
<text x='270' y='448' font-size='12' fill='#5F5E5A'>GetCursorPos() → 捏合中心 (1247, 633)</text>
<path d='M135 458V470' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='470' width='190' height='48' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='135' y='499' text-anchor='middle' font-size='14' font-weight='500' fill='#0C447C'>⑥ 合成双触点</text>
<text x='270' y='490' font-size='12' fill='#2C2C2A'>span = 90 × 1.0302 = 92.7 → 93（±90 起步是虚构基准）</text>
<text x='270' y='508' font-size='12' fill='#5F5E5A'>触点 (1154,633)/(1340,633) · INCONTACT|UPDATE</text>
<path d='M135 518V530' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='530' width='190' height='48' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='135' y='559' text-anchor='middle' font-size='14' font-weight='500' fill='#0C447C'>⑦ 手停 keep-alive</text>
<text x='270' y='550' font-size='12' fill='#2C2C2A'>span 不变 = 93 · 中心 ±1px 交替 · 每 120ms 一帧</text>
<text x='270' y='568' font-size='12' fill='#5F5E5A'>应用看到「两指按着」→ 手势活跃 → 不刷新不居中</text>
<path d='M135 578V590' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrowD)'/>
<rect x='40' y='590' width='190' height='56' rx='8' fill='#FAEEDA' stroke='#BA7517' stroke-width='1.5'/>
<text x='135' y='612' text-anchor='middle' font-size='14' font-weight='500' fill='#633806'>⑧ 松手 Up 定稿</text>
<text x='135' y='632' text-anchor='middle' font-size='11' fill='#854F0B'>INRANGE | UP</text>
<text x='270' y='610' font-size='12' fill='#2C2C2A'>MOUSE_FINGER off → 注入 INRANGE|UP</text>
<text x='270' y='628' font-size='12' fill='#5F5E5A'>应用收 WM_POINTERUP ×2 → 重排 → 变清晰</text>
<text x='40' y='672' font-size='12' fill='#5F5E5A'>数据在两端膨胀、中间极简：中间那 4 字节 factor 就是全部信息量（手停时网线安静，PC 端自己打拍子）</text>
</svg>
